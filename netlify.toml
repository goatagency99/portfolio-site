[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

# Fingerprint-free assets still benefit from a long cache: browsers will
# revalidate on change since Netlify's own asset hashing/ETags catch edits.
[[headers]]
  for = "/portfolio-assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/juan-mora-assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
